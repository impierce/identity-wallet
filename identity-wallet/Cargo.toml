[package]
name = "identity-wallet"
version = "0.21.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-fs = { version = "2" }
tauri-plugin-opener = { version = "2" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5.1"
chrono = "0.4"
derivative = "2.2"
downcast-rs = "1.2"
dyn-clone = "1.0"
futures = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
icu = "1.4.0"
identity-kit = { workspace = true, features = ["did-jwk", "did-key", "did-web", "domain-linkage", "linked-vp", "sd-jwt", "status-list"] }
iota_stronghold = { version = "2.1" }
itertools = "0.10"
jsonschema = "0.29"
jsonwebtoken.workspace = true
lazy_static = "1.4"
log.workspace = true
oid4vc-core.workspace = true
oid4vc-manager.workspace = true
oid4vci.workspace = true
oid4vp.workspace = true
openid-federation = "0.3.0"
p256 = { version = "0.13", features = ["jwk"] }
reqwest = { version = "0.13", default-features = false, features = [
    "gzip",
    "json",
    "rustls",
] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-retry = "0.9"
rustls.workspace = true
webpki-roots.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_with = "3.8"
sha256 = "1.4"
siopv2.workspace = true
stronghold_engine = { version = "2.0.1" }
stronghold_ext = { git = "https://github.com/impierce/stronghold_ext", default-features = false, features = ["es256"] }
strum = { version = "0.25", features = ["derive"] }
thiserror = "1.0"
tokio = { workspace = true, features = ["net", "time"] }
tracing = "0.1"
ts-rs = { version = "7.0", features = ["chrono-impl", "url-impl"] }
typetag = "0.2"
unicode-normalization = "0.1"
url = "2.5"
urlencoding = "2.1.3"
uuid = { version = "1.4", features = ["v4", "fast-rng", "serde"] }

# Reading the system DNS configuration links against macOS-only SystemConfiguration APIs, which break the iOS build.
[target.'cfg(not(target_os = "ios"))'.dependencies]
hickory-resolver = { version = "0.26", features = ["system-config"] }

[dev-dependencies]
identity-kit = { workspace = true, features = ["in-memory", "test-vectors"] }
serial_test.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[build-dependencies]
dotenvy = "0.15"

[features]
test_utils = ["tauri/test"]
