[package]
name = "identity-wallet"
version = "0.10.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-fs = { version = "2" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
derivative = "2.2"
did_manager.workspace = true
downcast-rs = "1.2"
dyn-clone = "1.0"
futures = "0.3"
icu = "1.4.0"
identity_credential = { git = "https://github.com/impierce/identity.rs", branch = "tmp/disable-typ-check", default-features = false, features = [
    "credential",
    "domain-linkage",
    "presentation",
    "validator",
    "sd-jwt-vc",
] }
identity_core = { git = "https://github.com/impierce/identity.rs", branch = "tmp/disable-typ-check" }
identity_eddsa_verifier = { git = "https://github.com/impierce/identity.rs", branch = "tmp/disable-typ-check" }
identity_iota = { git = "https://github.com/impierce/identity.rs", branch = "tmp/disable-typ-check" }
identity_jose = { git = "https://github.com/impierce/identity.rs", branch = "tmp/disable-typ-check" }
iota_stronghold = { version = "2.1" }
itertools = "0.10"
josekit = "0.10"
jsonschema = "0.29"
jsonwebtoken.workspace = true
lazy_static = "1.4"
log.workspace = true
oid4vc.workspace = true
p256 = { version = "0.13", features = ["jwk"] }
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_with = "3.8"
sha256 = "1.4"
stronghold_engine = { version = "2.0.1" }
stronghold_ext = { git = "https://github.com/impierce/stronghold_ext", features = [
    "crypto",
] }
strum = { version = "0.25", features = ["derive"] }
tauri-plugin-opener.workspace = true
thiserror = "1.0"
tokio.workspace = true
ts-rs = { version = "=7.0", features = ["chrono-impl"] }
typetag = "0.2"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.4", features = ["v4", "fast-rng", "serde"] }

[dev-dependencies]
serial_test.workspace = true
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
derivative = "2.2"
did_manager.workspace = true
downcast-rs = "1.2"
dyn-clone = "1.0"
futures = "0.3"
icu = "1.4.0"
tempfile.workspace = true
wiremock.workspace = true

[build-dependencies]
dotenvy = "0.15"

[features]
test_utils = ["tauri/test"]
