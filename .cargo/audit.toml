# Configuration for `cargo audit`, run by `.github/workflows/audit.yaml`.
#
# Every entry below needs a semver-incompatible upgrade of a crate reached only transitively,
# through `tauri` or through a test-only dependency. Anything `cargo update` can fix is fixed there
# instead. Each entry records why the vulnerable code is unreachable from a wallet that makes
# outbound HTTPS requests, holds keys in Stronghold, and runs no server.
#
# Revisit whenever `tauri` or the test dependencies move.

[advisories]
ignore = [
    # h2 0.3.27 — unbounded queueing of empty DATA frames. Only in tests, through
    # `hyper 0.14 <- wiremock 0.5`, a dev-dependency that serves local mock endpoints. Upstream ships
    # no 0.3.x patch; the app itself is on h2 0.4.
    "RUSTSEC-2026-0258",

    # quick-xml — denial-of-service on untrusted XML. Only through `plist <- tauri`, which reads the
    # app's own bundled property lists, never untrusted XML.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
