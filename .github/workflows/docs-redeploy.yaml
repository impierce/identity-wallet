name: Redeploy docs

# The documentation portal (github.com/impierce/docs) downloads `docs/app-reference.md` from `dev` when it is built.
# This workflow asks the portal to rebuild whenever that file changes, so the published app reference follows the app.
#
# It needs the repository secret `DOCS_DEPLOY_HOOK_URLS`: one or more Vercel deploy hook URLs of the docs project,
# separated by whitespace. Without the secret the workflow does nothing, and the portal picks up the new reference
# with its next deployment.

on:
  push:
    branches: ["dev"]
    paths: ["docs/app-reference.md"]
  workflow_dispatch:

permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger a build of the documentation portal
        env:
          DOCS_DEPLOY_HOOK_URLS: ${{ secrets.DOCS_DEPLOY_HOOK_URLS }}
        run: |
          if [ -z "$DOCS_DEPLOY_HOOK_URLS" ]; then
            echo "::notice::The secret DOCS_DEPLOY_HOOK_URLS is not set, so no build was triggered."
            exit 0
          fi
          # Every hook gets its request, also after another one failed or timed out. The step fails afterwards.
          failed=0
          for url in $DOCS_DEPLOY_HOOK_URLS; do
            # A deploy hook URL is a secret by itself: keep it out of the log, whatever curl reports.
            echo "::add-mask::$url"
            if ! curl --fail --silent --show-error --max-time 30 --output /dev/null --request POST "$url"; then
              echo "::error::A deploy hook did not accept the request."
              failed=1
            fi
          done
          exit "$failed"
