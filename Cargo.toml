[workspace]
resolver = "2"
members = ["identity-wallet", "unime/src-tauri"]

[workspace.dependencies]
tauri = { version = "2.2.5", features = [
    "protocol-asset",
    "rustls-tls",
] }
tauri-build = "2.0.5"

# did_manager = { git = "https://git@github.com/impierce/did-manager.git", tag = "v1.0.0-beta.4" }
did_manager = { git = "https://git@github.com/impierce/did-manager.git", rev = "b762f61" }
jsonwebtoken = "9.3"
log = "^0.4"
oid4vc = { git = "https://git@github.com/impierce/openid4vc.git", rev = "5384fcc" }

rand = "0.8"
serde_json = "1.0"
serial_test = "2.0"
tempfile = "3.5.0"
wiremock = "0.5"


[patch.'https://github.com/iotaledger/iota']
iota-sdk = { git = "https://github.com/impierce/iota", package = "iota-sdk", branch = "temp/fix" }
move-core-types = { git = "https://github.com/impierce/iota.git", package = "move-core-types", branch = "temp/fix" }
shared-crypto = { git = "https://github.com/impierce/iota.git", package = "shared-crypto", branch = "temp/fix" }


[workspace.package]
name = "unime"
version = "0.6.12"
description = "Identity Wallet for people to manage Decentralized Identities and Verifiable Credentials"
homepage = "https://www.impierce.com/"
authors = ["Impierce Technologies"]
keywords = ["identity", "did", "ssi", "wallet", "siopv2"]
license = "Apache-2.0"
repository = "https://github.com/impierce/identity-wallet"
edition = "2021"
rust-version = "1.76.0"
