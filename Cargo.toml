[workspace]
resolver = "2"
members = ["identity-wallet", "unime/src-tauri"]

[workspace.dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "rustls-tls"] }
tauri-build = "2.7.4"

did_manager = { git = "https://github.com/impierce/did-manager", rev = "cbf2993" }
identity-kit = { version = "0.5.0", default-features = false }
# openid4vc leaves the crypto backend to the application; `aws-lc-rs` is already in the tree through `rustls`.
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
log = "^0.4"
oid4vc-core = "0.6.0"
oid4vc-manager = "0.6.0"
oid4vci = "0.6.0"
oid4vp = "0.6.0"
rand = "0.8"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-platform-verifier = { version = "0.6" }
webpki-roots = "0.26"
serde_json = "1.0"
serial_test = "2.0"
siopv2 = "0.6.0"
tempfile = "3.5.0"
tokio = { version = "1.46", features = ["macros"] }
wiremock = "0.5"

[patch.crates-io]
# We need this patch because it makes the `Hasher` trait `Send` and `Sync`. See: https://github.com/iotaledger/sd-jwt-payload/compare/main...impierce:sd-jwt-payload:fix/hasher-send-sync
sd-jwt = { git = "https://github.com/impierce/sd-jwt-payload", rev = "f28789a", package = "sd-jwt-payload" }

[workspace.package]
version = "0.19.4"
description = "Identity Wallet for people to manage Decentralized Identities and Verifiable Credentials"
homepage = "https://www.impierce.com/"
authors = ["Impierce Technologies"]
keywords = ["identity", "did", "ssi", "wallet", "siopv2"]
license = "Apache-2.0"
repository = "https://github.com/impierce/identity-wallet"
edition = "2021"
rust-version = "1.95.0"
