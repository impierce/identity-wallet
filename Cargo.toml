[workspace]
resolver = "2"
members = ["identity-wallet", "unime/src-tauri"]

[workspace.dependencies]
tauri = { version = "2.2.5", features = [
    "protocol-asset",
    "rustls-tls",
] }
tauri-build = "2.0.5"

did_manager = { git = "https://git@github.com/impierce/did-manager.git", rev = "049a1e9" }
jsonwebtoken = "9.3"
log = "^0.4"
oid4vc = { git = "https://git@github.com/impierce/openid4vc.git", rev = "742af62" }
rand = "0.8"
serde_json = "1.0"
serial_test = "2.0"
tempfile = "3.5.0"
wiremock = "0.5"
# pin dependency of `time` and limit range, as `0.4.1` has impl for `usize: PartialOrd<_>`
# that conflicts with `iota-sdk`s `core` impl, leading to errors in `iota-sdk` crate
deranged = { version = ">=0.4.0, <0.4.1", default-features = false }
tokio = { version = "1.43.0", features = ["macros"] }

[workspace.package]
name = "unime"
version = "0.6.12"
description = "Identity Wallet for people to manage Decentralized Identities and Verifiable Credentials"
homepage = "https://www.impierce.com/"
authors = ["Impierce Technologies"]
keywords = ["identity", "did", "ssi", "wallet", "siopv2"]
license = "Apache-2.0"
repository = "https://github.com/impierce/identity-wallet"
edition = "2021"
rust-version = "1.76.0"
